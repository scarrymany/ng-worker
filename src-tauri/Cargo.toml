[package]
name = "ng-worker"
version = "1.0.1"
description = "NG Worker — облік угод для NG GTA 5 RP"
authors = ["scarrymany"]
license = "MIT"
edition = "2021"

[lib]
name = "ng_worker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
